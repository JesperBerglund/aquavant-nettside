<!--
nav: contact
-->
<section class="page-hero deep" aria-labelledby="page-title">
      <div class="container page-hero-content">
        <nav class="breadcrumb" aria-label="Brødsmuler"><ol><li><a href="index.html">{{t.page.link1}}</a></li><li aria-current="page">{{t.page.item1}}</li></ol></nav>
        <h1 id="page-title">{{t.page.title1}}</h1>
        <p class="lead">{{t.page.intro1}}</p>
      </div>
    </section>

    <div class="flow">
      <section class="section" aria-label="Kontaktinformasjon og skjema">
        <div class="container contact-grid">
          <div>
            <h2>{{t.s2.heading1}}</h2>
            <p class="lead">{{t.s2.intro1}}</p>
            <dl class="contact-list">
              <div><dt class="k">{{t.s2.term1}}</dt><dd><a href="mailto:{{email}}">{{email}}</a></dd></div>
              <div><dt class="k">{{t.s2.term2}}</dt><dd><a href="mailto:{{email2}}">{{email2}}</a></dd></div>
              <div><dt class="k">{{t.s2.term3}}</dt><dd><span class="v">{{t.s2.text1}}</span></dd></div>
              <div><dt class="k">{{t.s2.term4}}</dt><dd><span class="v">{{t.s2.text2}}</span><br><span class="k">{{t.s2.text3}}</span></dd></div>
            </dl>
          </div>

          <div class="block block--mist">
            <!-- Netlify Forms: submissions are stored in Netlify and emailed to both founders
                 (set up under Forms → Form notifications). bot-field is a spam trap. -->
            <form class="form" name="contact" method="post" action="contact.html?sent" data-netlify="true" netlify-honeypot="bot-field" data-contact data-fallback="{{email}}" novalidate>
              <input type="hidden" name="form-name" value="contact">
              <input type="hidden" name="language" value="Norsk">
              <p class="visually-hidden" aria-hidden="true"><label>Leave empty <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
              <div class="form-status" role="status" tabindex="-1"></div>
              <div class="form-row">
                <div class="field">
                  <label for="name">{{t.s2.field1}} <span class="req" aria-hidden="true">*</span></label>
                  <input id="name" name="name" type="text" autocomplete="name" required aria-describedby="name-error">
                  <span class="field-error" id="name-error"></span>
                </div>
                <div class="field">
                  <label for="email">{{t.s2.field2}} <span class="req" aria-hidden="true">*</span></label>
                  <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error">
                  <span class="field-error" id="email-error"></span>
                </div>
              </div>
              <div class="form-row">
                <div class="field">
                  <label for="organisation">{{t.s2.field3}}</label>
                  <input id="organisation" name="organisation" type="text" autocomplete="organization">
                </div>
                <div class="field">
                  <label for="topic">{{t.s2.field4}}</label>
                  <select id="topic" name="topic">
                    <option>{{t.s2.option1}}</option>
                    <option>{{t.s2.option2}}</option>
                    <option>{{t.s2.option3}}</option>
                    <option>{{t.s2.option4}}</option>
                    <option>{{t.s2.option5}}</option>
                    <option>{{t.s2.option6}}</option>
                  </select>
                </div>
              </div>
              <div class="field">
                <label for="message">{{t.s2.field5}} <span class="req" aria-hidden="true">*</span></label>
                <textarea id="message" name="message" required aria-describedby="message-hint message-error"></textarea>
                <span class="hint" id="message-hint">{{t.s2.text4}}</span>
                <span class="field-error" id="message-error"></span>
              </div>
              <div class="field">
                <label class="checkbox" for="consent"><input id="consent" name="consent" type="checkbox" value="yes" required aria-describedby="consent-error"> <span>{{t.s2.text5}} <a href="privacy.html">{{t.s2.link1}}</a>.</span></label>
                <span class="field-error" id="consent-error"></span>
              </div>
              <p class="hint">{{t.s2.text6}} <span class="req">*</span> {{t.s2.text7}}</p>
              <div><button class="btn btn--ocean" type="submit">{{t.s2.button1}}</button></div>
            </form>
          </div>
        </div>
      </section>
    </div>
